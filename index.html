<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전통 민속 윷놀이 (드래그 & 효과음 기능 추가)</title>
    <style>
        :root {
            --bg-color: #f8f4eb;
            --main-wood: #8c5a2b;
            --accent-red: #d9381e;
            --accent-blue: #0055a5;
            --accent-green: #2d8a4e;
            --accent-yellow: #e6a100;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 5px 0 15px 0;
            color: var(--main-wood);
            font-size: 28px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        #setup-screen {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            border: 3px solid var(--main-wood);
            max-width: 400px;
            width: 100%;
        }

        .btn {
            background: var(--main-wood);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.1s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-large {
            font-size: 22px;
            padding: 15px 30px;
            background: var(--accent-red);
            width: 100%;
            margin-top: 15px;
        }

        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        .game-layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        /* 윷판 스타일 */
        #board-container {
            position: relative;
            width: 450px;
            height: 450px;
            background: #f4e8c1;
            border: 8px solid var(--main-wood);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .node {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #fff8e7;
            border: 3px solid #8c5a2b;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #555;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .node.corner {
            width: 44px;
            height: 44px;
            border-width: 4px;
            border-color: var(--accent-red);
            background: #ffe8e8;
        }

        .node.center {
            width: 46px;
            height: 46px;
            border-width: 4px;
            border-color: var(--accent-blue);
            background: #e8f0ff;
        }

        .node.highlight {
            background: #a8ffb2 !important;
            border-color: #1b8a28 !important;
            box-shadow: 0 0 10px #1b8a28;
        }

        /* 컨트롤 및 윷 디스플레이 영역 */
        #control-panel {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 3px solid var(--main-wood);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #turn-info {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            background: var(--accent-red);
            width: 100%;
            text-align: center;
        }

        /* 큰 윷 던지기 그래픽 패널 */
        #yut-display-area {
            width: 100%;
            background: #fffbf0;
            border: 2px dashed var(--main-wood);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .yut-sticks {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        /* 윷 가락 아이콘 큰 그림 */
        .yut-stick {
            width: 45px;
            height: 110px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .yut-stick.flat {
            background: linear-gradient(to right, #f7e1b5, #ffffff, #f7e1b5);
            border: 3px solid #8c5a2b;
            color: #d9381e;
        }
