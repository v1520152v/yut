<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전통 민속 윷놀이</title>
    <style>
        :root {
            --main-wood: #8c5a2b;
            --accent-red: #d9381e;
            --accent-blue: #0055a5;
            --accent-green: #2d8a4e;
            --accent-yellow: #e6a100;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: #f8f4eb;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 5px 0 15px 0;
            color: var(--main-wood);
            font-size: 28px;
        }

        /* 팀 선택 화면 */
        #setup-screen {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            border: 3px solid var(--main-wood);
            max-width: 400px;
            width: 100%;
        }

        .btn {
            background: var(--main-wood);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        .btn-large {
            font-size: 24px;
            padding: 15px 30px;
            background: var(--accent-red);
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn-large:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        .game-layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        /* 윷판 디자인 */
        #board-container {
            position: relative;
            width: 450px;
            height: 450px;
            background: #f4e8c1;
            border: 8px solid var(--main-wood);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .node {
            position: absolute;
            width: 38px;
            height: 38px;
            background: #fff8e7;
            border: 3px solid #8c5a2b;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #555;
            cursor: pointer;
        }

        .node.corner {
            width: 46px;
            height: 46px;
            border-width: 4px;
            border-color: var(--accent-red);
            background: #ffe8e8;
        }

        .node.center {
            width: 48px;
            height: 48px;
            border-width: 4px;
            border-color: var(--accent-blue);
            background: #e8f0ff;
        }

        .node.selected {
            background: #ffe600 !important;
            border-color: #ff0000 !important;
            box-shadow: 0 0 12px #ff0000;
        }

        /* 대시보드 & 윷 디스플레이 */
        #control-panel {
            flex: 1;
            min-width: 320px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 3px solid var(--main-wood);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #turn-info {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            background: var(--accent-red);
            width: 100%;
            text-align: center;
        }

        #yut-display-area {
            width: 100%;
            background: #fffbf0;
            border: 2px dashed var(--main-wood);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .yut-sticks {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            min-height: 110px;
        }

        /* 대형 윷 가락 디자인 */
        .yut-stick {
            width: 45px;
            height: 110px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.2);
        }

        .yut-stick.flat {
            background: linear-gradient(to right, #f7e1b5, #ffffff, #f7e1b5);
            border: 3px solid #8c5a2b;
            color: #d9381e;
        }

        .yut-stick.round {
            background: linear-gradient(to right, #6e3e15, #a36224, #522d0e);
            border: 3px solid #3d1f08;
            color: #ffcc00;
        }

        /* 크고 명확한 한글 결과 글씨 */
        #result-text {
            font-size: 38px;
            font-weight: 900;
            color: var(--accent-red);
            margin-top: 5px;
            min-height: 50px;
        }

        /* 대기 및 이동 가능한 말 목록 */
        #piece-wait-area {
            width: 100%;
            margin-top: 10px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
        }

        .team-pieces {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .team-label {
            font-weight: bold;
            width: 65px;
            font-size: 14px;
        }

        .pieces-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 말 스타일 (
